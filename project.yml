name: AFUScale
options:
  bundleIdPrefix: com.afuscale
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AFUScale:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afuscale.AFUScale
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: NO
        SKIP_INSTALL: NO
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    entitlements:
      path: App/AFUScale.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies: []