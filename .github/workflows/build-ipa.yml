# =============================================================================
#  ant-afu-scale · 自动出包（编译检查 + 归档导出 IPA + 发布 Release）
# -----------------------------------------------------------------------------
#  两个 job：
#   1) compile-check : PR / push 到 main / 手动触发，验证代码能编译（不需要签名）
#   2) build-ipa     : 打 tag（v*）/ 手动触发 / push 到 main,master 时触发
#                       · 已配置签名 Secrets → 完整 签名 → 归档 → 导出 IPA → 发布
#                       · 未配置签名 Secrets → 退化为「仅编译验证」，不产出 IPA
#                         （注意：GitHub 禁止在 if: 里引用 secrets，故用 step
#                          output 在 if: 中判断，secrets 仅通过 env: 注入）
#
#  出包（produce 一个签名 IPA）需要你在本仓库 Settings → Secrets 中配置以下密钥：
#    P12_BASE64                  : 发布证书 .p12 的 base64（openssl base64 -in cert.p12）
#    P12_PASSWORD                : .p12 的密码
#    PROVISIONING_PROFILE_BASE64 : .mobileprovision 的 base64
#    KEYCHAIN_PASSWORD           : 给 CI 临时钥匙串设的密码（随意一段）
#    APPLE_TEAM_ID               : 你的 Apple Developer Team ID（项目默认 VPG8LV8783）
#    BUNDLE_ID                   : App Bundle ID（项目默认 shuhui.scaleapp，建议改成你自己的）
#    PROVISIONING_PROFILE_NAME   : 描述文件名称（在开发者后台 Profiles 里看到的名字）
#    CODE_SIGN_IDENTITY          : 签名身份，如 "Apple Distribution: Your Name (TEAMID)"
#
#  注意：本项目接入了 HealthKit，描述文件对应的 App ID 必须已开启 HealthKit 能力，
#        否则归档/导出会失败。建议用 App Store 发布描述文件（method: app-store）。
# =============================================================================

name: Build & Release IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA 导出方式"
        required: true
        default: "app-store"
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
      version:
        description: "构建版本号（留空则用 Info.plist 中的 MARKETING_VERSION）"
        required: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) 编译检查：不需要任何签名，验证代码可编译
  # ---------------------------------------------------------------------------
  compile-check:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    # 注：macos-15 为 arm64 托管 runner，GitHub 在高峰期可能排队较久（容量提示，非错误）。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (16+，项目用了同步目录特性)
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes (调试用)
        run: xcodebuild -list -project Scale.xcodeproj

      - name: Build without signing (仅验证编译)
        run: |
          xcodebuild build \
            -project Scale.xcodeproj \
            -scheme "Scale App" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------------------
  # 2) 出包 / 编译：有签名 Secrets 就出 IPA，没有就退化为仅编译
  #    （触发条件放宽到 push 到 main/master，因此普通 push 也不会再被 skipped）
  # ---------------------------------------------------------------------------
  build-ipa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    # 注：macos-15 为 arm64 托管 runner，GitHub 在高峰期可能排队较久（容量提示，非错误）。
    runs-on: macos-15
    env:
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (16+)
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes (调试用)
        run: xcodebuild -list -project Scale.xcodeproj

      # ===== 检测是否已配置签名 Secrets（secrets 仅经 env 注入，不在 if: 中引用）=====
      - name: 检测签名 Secrets 是否就绪
        id: detect
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已检测到签名 Secrets，将执行完整归档 + 导出 IPA"
          else
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名 Secrets（P12_BASE64 / PROVISIONING_PROFILE_BASE64 缺失），本次仅做编译验证，不产出 IPA。需在仓库 Settings → Secrets 配置 8 个密钥后才能出包。"
          fi

      # ===== 以下 4 步仅在已配置签名 Secrets 时执行 =====
      - name: Install Apple certificate & provisioning profile
        if: steps.detect.outputs.signing_ready == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Generate ExportOptions.plist
        if: steps.detect.outputs.signing_ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${TEAM_ID:-VPG8LV8783}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID:-shuhui.scaleapp}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>${SIGN_IDENTITY}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          echo "---- ExportOptions.plist ----"
          cat ExportOptions.plist

      - name: Archive (signed)
        if: steps.detect.outputs.signing_ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          xcodebuild archive \
            -project Scale.xcodeproj \
            -scheme "Scale App" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ScaleApp.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID:-VPG8LV8783}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID:-shuhui.scaleapp}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        if: steps.detect.outputs.signing_ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ScaleApp.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/ipa"
          echo "---- 生成的 IPA ----"
          find "$PWD/build/ipa" -name "*.ipa"

      # ===== 未配置签名 Secrets 时的退化步骤（保证 job 不 skip / 不硬失败）=====
      - name: Build only (no signing)
        if: steps.detect.outputs.signing_ready == 'false'
        run: |
          echo "::notice::未检测到签名 Secrets（P12_BASE64 / PROVISIONING_PROFILE_BASE64），跳过归档/导出，仅做编译验证。"
          echo "如需产出签名 IPA，请在仓库 Settings → Secrets 配置 8 个密钥后，打 tag（v*）或手动触发本 workflow 重试。"
          xcodebuild build \
            -project Scale.xcodeproj \
            -scheme "Scale App" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA artifact
        if: steps.detect.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ScaleApp-ipa
          path: build/ipa/*.ipa

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.detect.outputs.signing_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
