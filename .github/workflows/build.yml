name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6   # v4→v6，消除 Node20 deprecated 警告

    - name: Verify Xcode
      run: xcodebuild -version

    - name: Install XcodeGen and ldid
      run: |
        brew install xcodegen
        brew install ldid

    - name: Generate Xcode project
      run: xcodegen generate

    # 归档阶段彻底无签名（CODE_SIGNING_ALLOWED=NO）。
    # 这里不嵌 entitlements，交由后面的 ldid fakesign 步骤完成，避免 xcodebuild
    # 的 ad-hoc 签名与工程配置冲突（之前 exit code 65 的原因）。
    - name: Archive (unsigned)
      run: |
        xcodebuild archive \
          -scheme AFUScale \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath AFUScale.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    # 不用 xcodebuild -exportArchive（它会因 method=development 强制要求 teamID 非空而报错）。
    # 这里直接从 .xcarchive 里取出 .app，用 ldid 做 fakesign 注入 healthkit entitlement，
    # 再手动打包成 Payload/*.app 结构重命名为 .ipa —— TrollStore 场景下最可控的做法。
    # TrollStore 安装时用假根证书重签会「原样保留」二进制里已有的 entitlements，
    # 从而让 HealthKit 授权开关在无付费证书的情况下正常弹出。
    - name: Inject HealthKit entitlement via ldid & package IPA
      run: |
        set -e
        rm -rf Payload
        mkdir Payload
        cp -R AFUScale.xcarchive/Products/Applications/AFUScale.app Payload/
        APP="Payload/AFUScale.app"
        BIN="$APP/AFUScale"

        # 确认 entitlements 源文件存在且是有效 plist
        echo "== entitlements 源文件 =="
        ls -l "$PWD/App/AFUScale.entitlements"
        plutil -lint "$PWD/App/AFUScale.entitlements"

        # 关键修复：ldid 内置 plist 解析器对带 <!DOCTYPE> 外部 DTD 的 XML 解析不稳，
        # 会返回 NULL 触发 "plist != NULL"。转成 ldid 原生支持的二进制 plist 彻底规避。
        plutil -convert binary1 -o "$PWD/afu-ent.bin" "$PWD/App/AFUScale.entitlements"
        echo "== 转换后的二进制 entitlements =="
        ls -l "$PWD/afu-ent.bin"

        echo "== 注入前 entitlements =="
        codesign -d --entitlements :- "$BIN" 2>/dev/null || echo "(无签名)"

        echo "== 用 ldid 写入 healthkit entitlement =="
        ldid -S"$PWD/afu-ent.bin" "$BIN"

        echo "== 注入后 entitlements =="
        codesign -d --entitlements :- "$BIN" 2>/dev/null || echo "(ldid 已 fakesign)"

        # 打包成 IPA（Payload 目录 zip 后改名 .ipa）
        rm -f AFUScale.ipa
        zip -qr AFUScale.ipa Payload

    # 最终校验：确认 healthkit entitlement 真的进了 IPA 内的二进制。
    # 优先用 ldid -e 读取（ldid 签名的二进制用 ldid 自身 dump 最准确），
    # 失败再回退到 codesign。
    - name: Verify HealthKit entitlement in IPA
      run: |
        rm -rf /tmp/verify && mkdir -p /tmp/verify
        unzip -o -q AFUScale.ipa -d /tmp/verify
        BIN="/tmp/verify/Payload/AFUScale.app/AFUScale"
        echo "== IPA 内二进制 entitlements =="
        (ldid -e "$BIN" 2>/dev/null || codesign -d --entitlements :- "$BIN" 2>/dev/null) || true
        (ldid -e "$BIN" 2>/dev/null || codesign -d --entitlements :- "$BIN" 2>/dev/null) | grep -q "com.apple.developer.healthkit" \
          && echo "OK: healthkit entitlement 已嵌入 IPA" \
          || (echo "FAIL: healthkit entitlement 缺失"; exit 1)

    - uses: actions/upload-artifact@v5   # v4→v5，同样消除 Node20 警告
      with:
        name: AFUScale
        path: AFUScale.ipa
