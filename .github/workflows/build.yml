name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6   # v4→v6，消除 Node20 deprecated 警告

    - name: Verify Xcode
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    # 归档阶段彻底无签名（CODE_SIGNING_ALLOWED=NO）。
    #
    # 重要说明（踩坑记录）：本项目走 TrollStore 免签安装。受保护的
    # com.apple.developer.healthkit 这种 entitlement 在免签下无法被系统授权，
    # 一旦注入二进制，iOS 启动时会因 "Unsatisfied entitlements" 直接 SIGKILL 闪退。
    # 因此这里【不注入任何受保护 entitlement】。HealthKit 的数据写入由 App 内的
    # 快捷指令兜底逻辑处理（HealthWriter 授权失败自动降级到 useShortcut()），
    # 这正是本项目在 TrollStore 免签场景下的正确用法。
    #
    # 若要 HealthKit 真正弹开关并写入苹果健康，必须改用真签名
    # （免费/付费 Apple 开发者账号 + App ID 开启 HealthKit + provisioning profile），
    # 那需要在 workflow 里配置证书/描述文件 secrets，已超出 TrollStore 免签范围。
    - name: Archive (unsigned)
      run: |
        xcodebuild archive \
          -scheme AFUScale \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath AFUScale.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    # 从 .xcarchive 取出 .app，直接打包成 IPA（Payload/*.app 结构）。
    # 不调用 xcodebuild -exportArchive（它会因 method=development 强制要求 teamID 非空而报错），
    # 也不注入受保护 entitlement（避免闪退）。TrollStore 安装时会用 CoreTrust 漏洞自行签名。
    - name: Package IPA
      run: |
        rm -rf Payload
        mkdir Payload
        cp -R AFUScale.xcarchive/Products/Applications/AFUScale.app Payload/
        rm -f AFUScale.ipa
        zip -qr AFUScale.ipa Payload

    - name: Verify IPA structure
      run: |
        echo "== IPA 内容 =="
        unzip -l AFUScale.ipa
        test -f Payload/AFUScale.app/AFUScale && echo "OK: 二进制存在" || (echo "FAIL: 二进制缺失"; exit 1)

    - uses: actions/upload-artifact@v5   # v4→v5，同样消除 Node20 警告
      with:
        name: AFUScale
        path: AFUScale.ipa
