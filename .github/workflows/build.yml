name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6

    - name: Verify Xcode
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Archive (ad-hoc signed, entitlements embedded)
      run: |
        xcodebuild archive \
          -scheme AFUScale \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath AFUScale.xcarchive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGN_ENTITLEMENTS="App/AFUScale.entitlements" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Verify entitlements embedded
      run: |
        APP="AFUScale.xcarchive/Products/Applications/AFUScale.app"
        echo "== 已嵌入的 entitlements =="
        codesign -d --entitlements :- "$APP" 2>/dev/null || true
        echo ""
        echo "== 校验 com.apple.developer.healthkit =="
        codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q "com.apple.developer.healthkit" \
          && echo "OK: healthkit entitlement 已嵌入" \
          || (echo "FAIL: healthkit entitlement 缺失"; exit 1)

    - name: Export IPA
      run: |
        EXPORT_PLIST=$(mktemp)
        cat > "$EXPORT_PLIST" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>development</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string></string>
          <key>provisioningProfiles</key><dict/>
        </dict>
        </plist>
        PLIST

        xcodebuild -exportArchive \
          -archivePath AFUScale.xcarchive \
          -exportPath . \
          -exportOptionsPlist "$EXPORT_PLIST" \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - uses: actions/upload-artifact@v5
      with:
        name: AFUScale
        path: AFUScale.ipa
