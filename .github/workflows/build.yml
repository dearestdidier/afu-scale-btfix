name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v6   # v4→v6，消除 Node20 deprecated 警告

    - name: Select Xcode 15.4
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'    # 不要写 '15.0'，runner 上没有；15.4 是 macos-14 自带的

    - name: Verify Xcode
      run: xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Archive
      run: |
        xcodebuild archive \
          -scheme AFUScale \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath AFUScale.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        EXPORT_PLIST=$(mktemp)
        cat > "$EXPORT_PLIST" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>development</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string></string>
          <key>provisioningProfiles</key><dict/>
        </dict>
        </plist>
        PLIST

        xcodebuild -exportArchive \
          -archivePath AFUScale.xcarchive \
          -exportPath . \
          -exportOptionsPlist "$EXPORT_PLIST" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - uses: actions/upload-artifact@v5   # v4→v5，同样消除 Node20 警告
      with:
        name: AFUScale
        path: AFUScale.ipa
