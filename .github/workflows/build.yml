name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v6   # v4→v6，消除 Node20 deprecated 警告

    - name: Verify Xcode
      run: xcodebuild -version

    - name: Install XcodeGen and ldid
      run: |
        brew install xcodegen
        brew install ldid

    - name: Generate Xcode project
      run: xcodegen generate

    # 归档阶段彻底无签名（CODE_SIGNING_ALLOWED=NO）。
    # 这里不嵌 entitlements，交由后面的 ldid fakesign 步骤完成，避免 xcodebuild
    # 的 ad-hoc 签名与工程配置冲突（之前 exit code 65 的原因）。
    - name: Archive (unsigned)
      run: |
        xcodebuild archive \
          -scheme AFUScale \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath AFUScale.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    # 导出无签名 IPA。
    - name: Export IPA (unsigned)
      run: |
        EXPORT_PLIST=$(mktemp)
        cat > "$EXPORT_PLIST" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>development</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string></string>
          <key>provisioningProfiles</key><dict/>
        </dict>
        </plist>
        PLIST

        xcodebuild -exportArchive \
          -archivePath AFUScale.xcarchive \
          -exportPath . \
          -exportOptionsPlist "$EXPORT_PLIST" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    # 用 ldid 给二进制做 fakesign，把 healthkit entitlement 显式注入代码签名。
    # TrollStore 安装时用假根证书重签会「原样保留」二进制里已有的 entitlements，
    # 从而让 HealthKit 授权开关在无付费证书的情况下正常弹出。
    - name: Inject HealthKit entitlement via ldid
      run: |
        rm -rf Payload
        mkdir Payload
        cp -R AFUScale.xcarchive/Products/Applications/AFUScale.app Payload/
        APP="Payload/AFUScale.app"
        BIN="$APP/AFUScale"

        echo "== 注入前 entitlements =="
        codesign -d --entitlements :- "$BIN" 2>/dev/null || echo "(无签名)"

        echo "== 写入 healthkit entitlement =="
        ldid -SApp/AFUScale.entitlements "$BIN"

        echo "== 注入后 entitlements =="
        codesign -d --entitlements :- "$BIN" 2>/dev/null || echo "(ldid 已 fakesign)"

        # 重新打包成 IPA
        rm -f AFUScale.ipa
        zip -qr AFUScale.ipa Payload

    # 最终校验：确认 healthkit entitlement 真的进了二进制。
    - name: Verify HealthKit entitlement
      run: |
        APP="AFUScale.xcarchive/Products/Applications/AFUScale.app/AFUScale"
        echo "== 归档产物校验 =="
        codesign -d --entitlements :- "$APP" 2>/dev/null || true
        echo ""
        echo "== IPA 内二进制校验 =="
        unzip -p AFUScale.ipa "Payload/AFUScale.app/AFUScale" > /tmp/AFUScale.bin 2>/dev/null || true
        codesign -d --entitlements :- /tmp/AFUScale.bin 2>/dev/null | grep -q "com.apple.developer.healthkit" \
          && echo "OK: healthkit entitlement 已嵌入 IPA" \
          || (echo "FAIL: healthkit entitlement 缺失"; exit 1)

    - uses: actions/upload-artifact@v5   # v4→v5，同样消除 Node20 警告
      with:
        name: AFUScale
        path: AFUScale.ipa
