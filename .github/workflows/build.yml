# =============================================================================
#  ant-afu-scale · 自动出包（编译检查 + 签名归档导出 IPA + 发布 Release）
# -----------------------------------------------------------------------------
#  两个 job：
#   1) compile-check : 任何 push / PR 都跑，仅验证代码能编译（不需要签名证书）
#   2) build-ipa     : 打 tag（v*）或手动触发时跑，完整签名 → 归档 → 导出 IPA
#                       → 上传构建产物，并在打 tag 时自动发布 GitHub Release
#
#  出包（build-ipa）需要你在本仓库 Settings → Secrets 中配置以下密钥：
#    P12_BASE64                  : 发布证书 .p12 的 base64（openssl base64 -in cert.p12）
#    P12_PASSWORD                : .p12 的密码
#    PROVISIONING_PROFILE_BASE64 : .mobileprovision 的 base64
#    KEYCHAIN_PASSWORD           : 给 CI 临时钥匙串设的密码（随意一段）
#    APPLE_TEAM_ID               : 你的 Apple Developer Team ID（项目默认 VPG8LV8783）
#    BUNDLE_ID                   : App Bundle ID（项目默认 shuhui.scaleapp，建议改成你自己的）
#    PROVISIONING_PROFILE_NAME   : 描述文件名称（在开发者后台 Profiles 里看到的名字）
#    CODE_SIGN_IDENTITY          : 签名身份，如 "Apple Distribution: Your Name (TEAMID)"
#
#  注意：本项目接入了 HealthKit，描述文件对应的 App ID 必须已开启 HealthKit 能力，
#        否则归档/导出会失败。建议用 App Store 发布描述文件（method: app-store）。
# =============================================================================

name: Build & Release IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA 导出方式"
        required: true
        default: "app-store"
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
      version:
        description: "构建版本号（留空则用 Info.plist 中的 MARKETING_VERSION）"
        required: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) 编译检查：不需要任何签名，验证代码可编译（PR / 普通 push 触发）
  # ---------------------------------------------------------------------------
  compile-check:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (16+，项目用了同步目录特性)
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes (调试用)
        run: xcodebuild -list -project Scale.xcodeproj

      - name: Build without signing (仅验证编译)
        run: |
          xcodebuild build \
            -project Scale.xcodeproj \
            -scheme "Scale App" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

  # ---------------------------------------------------------------------------
  # 2) 出包：签名 → 归档 → 导出 IPA → 发布（打 tag 或手动触发）
  # ---------------------------------------------------------------------------
  build-ipa:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (16+)
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes (调试用)
        run: xcodebuild -list -project Scale.xcodeproj

      # ---- 导入证书 & 描述文件（缺任意一个则直接报错退出）----
      - name: Install Apple certificate & provisioning profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::未配置签名 Secrets（P12_BASE64 / PROVISIONING_PROFILE_BASE64）。请在仓库 Settings → Secrets 中配置后再出包，或仅用 compile-check 验证编译。"
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      # ---- 生成 exportOptions.plist（用 secrets 中的值填充）----
      - name: Generate ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${TEAM_ID:-VPG8LV8783}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID:-shuhui.scaleapp}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>${SIGN_IDENTITY}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          echo "---- ExportOptions.plist ----"
          cat ExportOptions.plist

      # ---- 归档 ----
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          xcodebuild archive \
            -project Scale.xcodeproj \
            -scheme "Scale App" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ScaleApp.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID:-VPG8LV8783}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID:-shuhui.scaleapp}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      # ---- 导出 IPA ----
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ScaleApp.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/ipa"
          echo "---- 生成的 IPA ----"
          find "$PWD/build/ipa" -name "*.ipa"

      # ---- 上传构建产物（即使不打 tag 也能在 Actions 页面下载）----
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScaleApp-ipa
          path: build/ipa/*.ipa

      # ---- 打 tag 时自动发布 GitHub Release ----
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
